<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke="#3B2A1F" stroke-width="1.4">
    <!-- vine -->
    <path d="M 40 660 C 220 600, 300 520, 420 470 C 560 410, 640 300, 760 120" />

    <!-- flower cluster 1 -->
    <g transform="translate(120,560) rotate(-8)">
      <g stroke="#3B2A1F">
        <ellipse cx="0" cy="-32" rx="16" ry="34" transform="rotate(0)" />
        <ellipse cx="0" cy="-32" rx="16" ry="34" transform="rotate(72)" />
        <ellipse cx="0" cy="-32" rx="16" ry="34" transform="rotate(144)" />
        <ellipse cx="0" cy="-32" rx="16" ry="34" transform="rotate(216)" />
        <ellipse cx="0" cy="-32" rx="16" ry="34" transform="rotate(288)" />
      </g>
      <circle cx="0" cy="0" r="4" fill="#3B2A1F" stroke="none" />
      <path d="M 0 0 C 6 18, 4 34, 10 46" />
      <circle cx="10" cy="47" r="2.6" fill="#3B2A1F" stroke="none" />
    </g>

    <!-- flower cluster 2, larger, near top -->
    <g transform="translate(700,140) rotate(18) scale(1.35)">
      <g stroke="#3B2A1F">
        <ellipse cx="0" cy="-32" rx="16" ry="34" transform="rotate(0)" />
        <ellipse cx="0" cy="-32" rx="16" ry="34" transform="rotate(72)" />
        <ellipse cx="0" cy="-32" rx="16" ry="34" transform="rotate(144)" />
        <ellipse cx="0" cy="-32" rx="16" ry="34" transform="rotate(216)" />
        <ellipse cx="0" cy="-32" rx="16" ry="34" transform="rotate(288)" />
      </g>
      <circle cx="0" cy="0" r="4" fill="#3B2A1F" stroke="none" />
      <path d="M 0 0 C 6 18, 4 34, 10 46" />
      <circle cx="10" cy="47" r="2.6" fill="#3B2A1F" stroke="none" />
    </g>

    <!-- small bud -->
    <g transform="translate(430,455) rotate(-30) scale(0.55)">
      <ellipse cx="0" cy="-30" rx="15" ry="32" />
      <ellipse cx="0" cy="-30" rx="15" ry="32" transform="rotate(40)" />
    </g>

    <!-- leaves -->
    <path d="M 300 540 C 330 520, 360 520, 380 495 C 360 515, 340 525, 300 540 Z" />
    <path d="M 620 250 C 650 230, 660 210, 690 190 C 665 215, 645 230, 620 250 Z" />
  </g>
</svg>
